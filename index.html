<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>AFLS Front Office</title>
    <meta
      name="description"
      content="AFLS is a deep American football management simulation: run a franchise in a fictional 32-team league and watch every snap play out from player-vs-player matchups."
    />
    <!-- Inline, because the single-file build ships one HTML file and nothing from public/ would come along. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151a21'/%3E%3Cg transform='rotate(-38 32 32)'%3E%3Cellipse cx='32' cy='32' rx='26' ry='15' fill='%23b4602f'/%3E%3Cpath d='M14 32h36' stroke='%23f4f1ea' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M23 28v8M29 28v8M35 28v8M41 28v8' stroke='%23f4f1ea' stroke-width='2.5' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E" />
    <!-- The saved theme (ui/theme.tsx), applied before the first paint so a dark choice never flashes light. -->
    <script>
      try {
        var t = localStorage.getItem('afls-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
